name: Zotero Bot Gemini

on:
  schedule:
    - cron: '0 22 * * 1,3'
  workflow_dispatch:

jobs:
  run-zotero-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests aiohttp pymupdf

      - name: Run Zotero Gemini bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          ZOTERO_DISCORD_WEBHOOK_URL: ${{ secrets.ZOTERO_DISCORD_WEBHOOK_URL }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_USERNAME: ${{ secrets.ZOTERO_USERNAME }}
          UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
        run: python zotero_bot_gemini.py
