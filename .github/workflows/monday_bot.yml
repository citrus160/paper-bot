name: Weekly Paper Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 0'  # 월요일 오전 07시 (KST)
jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 커밋 권한
    steps:
      - uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: 라이브러리 설치
        run: pip install aiohttp requests
      - name: 봇 실행
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python paper_bot.py
      - name: seen_papers.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_papers.json
          git diff --staged --quiet || git commit -m "Update seen_papers.json [skip ci]"
          git push
